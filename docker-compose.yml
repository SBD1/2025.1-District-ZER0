version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: district_zero_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: district_zero
      POSTGRES_USER: district_zero_user
      POSTGRES_PASSWORD: district_zero_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Dev:/docker-entrypoint-initdb.d
    networks:
      - district_zero_network

  adminer:
    image: adminer:4.8.1
    container_name: district_zero_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - district_zero_network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  district_zero_network:
    driver: bridge 